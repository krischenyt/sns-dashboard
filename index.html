<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNS Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e}
.tab-nav{background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab-nav h1{font-size:14px;font-weight:600;color:#1a1a2e;margin-right:24px;padding:14px 0;white-space:nowrap}
.tab-btn{padding:14px 16px;font-size:12.5px;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;transition:all .15s}
.tab-btn.active{color:#3b5bdb;border-bottom-color:#3b5bdb;font-weight:500}
.tab-pane{display:none}.tab-pane.active{display:block}
.page{max-width:1500px;margin:0 auto;padding:16px 20px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric{background:#fff;border-radius:10px;padding:16px 18px;border:1px solid #e5e9f0}
.metric .lbl{font-size:10.5px;color:#6b7280;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.metric .val{font-size:20px;font-weight:700;color:#1a1a2e;letter-spacing:-.3px}
.metric .sub{font-size:11px;color:#6b7280;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;margin-top:4px}
.pill.up{background:#dcfce7;color:#15803d}.pill.down{background:#fee2e2;color:#dc2626}
.card{background:#fff;border-radius:10px;border:1px solid #e5e9f0;overflow:hidden}
.card-head{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f5;gap:8px}
.card-head h2{font-size:12.5px;font-weight:600;color:#374151;flex-shrink:0}
.seg{display:flex;gap:3px;background:#f3f4f6;border-radius:7px;padding:3px;flex-shrink:0}
.seg button{background:transparent;border:none;padding:3px 9px;border-radius:5px;font-size:11px;color:#6b7280;cursor:pointer;transition:all .12s;white-space:nowrap}
.seg button.active{background:#fff;color:#1a1a2e;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row2{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-bottom:14px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.search-wrap{padding:10px 14px;border-bottom:1px solid #f0f2f5}
.search-wrap input{width:100%;padding:7px 10px;border:1px solid #e5e9f0;border-radius:7px;font-size:12px;outline:none;color:#374151}
.search-wrap input:focus{border-color:#93c5fd}
.filter-row{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid #f0f2f5;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{background:transparent;border:1px solid #e5e9f0;color:#6b7280;padding:3px 10px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .12s;flex-shrink:0}
.filter-btn:hover,.filter-btn.active{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
.asin-list{overflow-y:auto;height:460px}
.asin-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:background .1s}
.asin-row:hover{background:#f8fafc}.asin-row.sel{background:#eff6ff;border-left:2px solid #3b82f6}
.dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.asin-meta{flex:1;min-width:0}
.asin-nm{font-size:11px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asin-cd{font-size:9.5px;color:#9ca3af;font-family:monospace;margin-top:1px}
.asin-pct{font-size:11px;font-weight:600;flex-shrink:0}
.asin-pct.up{color:#15803d}.asin-pct.dn{color:#dc2626}
.asin-rank{font-size:9.5px;color:#d1d5db;width:22px;text-align:right;flex-shrink:0;font-family:monospace}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid #f0f2f5;min-height:36px}
.leg{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#6b7280;cursor:pointer;padding:2px 7px;border-radius:5px;border:1px solid #e5e9f0}
.leg:hover{border-color:#93c5fd}
.leg-d{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.hm-wrap{overflow:auto;max-height:460px}
.hm{border-collapse:collapse;font-size:9.5px}
.hm th{padding:4px 7px;text-align:center;font-weight:500;color:#6b7280;background:#f8fafc;position:sticky;top:0;white-space:nowrap;z-index:2}
.hm th.s{text-align:left;position:sticky;left:0;z-index:3;background:#f8fafc;min-width:82px}
.hm td{padding:3px 5px;text-align:right;border:1px solid #f0f2f5;white-space:nowrap;font-family:monospace}
.hm td.s{text-align:left;position:sticky;left:0;background:#fff;font-family:-apple-system,sans-serif;font-size:10px;font-weight:500;color:#374151;padding:3px 8px;min-width:82px;border-right:1px solid #e5e9f0;z-index:1;cursor:pointer}
.hm td.s:hover{background:#eff6ff;color:#3b5bdb}
.rank-tbl{width:100%;border-collapse:collapse}
.rank-tbl th{padding:7px 12px;font-size:10px;color:#6b7280;text-align:left;border-bottom:1px solid #f0f2f5;text-transform:uppercase;letter-spacing:.4px}
.rank-tbl td{padding:7px 12px;font-size:11px;border-bottom:1px solid #f8fafc;vertical-align:middle}
.rank-tbl tr:last-child td{border-bottom:none}
.rank-tbl tr:hover td{background:#fafbff}
.bar-bg{height:3px;background:#f0f2f5;border-radius:2px;margin-top:3px}
.bar-f{height:3px;border-radius:2px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(820px,95vw);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{padding:14px 18px;border-bottom:1px solid #f0f2f5;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-head-info h3{font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:2px}
.modal-head-info p{font-size:11px;color:#6b7280;font-family:monospace}
.modal-close{background:none;border:none;font-size:20px;color:#9ca3af;cursor:pointer;padding:2px 6px;border-radius:5px;flex-shrink:0}
.modal-close:hover{background:#f3f4f6;color:#374151}
.modal-stats{display:flex;gap:20px;padding:10px 18px;border-bottom:1px solid #f0f2f5;background:#fafbff;flex-wrap:wrap}
.modal-stat{font-size:11px;color:#6b7280}
.modal-stat strong{color:#1a1a2e;font-size:13px;display:block}
.modal-body{padding:16px 18px;flex:1;overflow:auto}
</style>
</head>
<body>

<div class="tab-nav">
  <h1>SNS Dashboard</h1>
  <button class="tab-btn active" onclick="switchTab('main',this)">📊 全部 ASIN (820)</button>
  <button class="tab-btn" onclick="switchTab('nb',this)">🔵 NatureBell Pattern (63)</button>
</div>

<!-- ===== MAIN TAB ===== -->
<div id="tab-main" class="tab-pane active">
<div class="page">
  <div class="metrics" id="metrics"></div>
  <div class="row2">
    <div class="card">
      <div class="card-head">
        <h2>ASIN 列表</h2>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:10px;color:#9ca3af" id="listCount"></span>
          <div class="seg">
            <button class="active" onclick="sortList('total',this)">總量</button>
            <button onclick="sortList('up',this)">漲</button>
            <button onclick="sortList('down',this)">跌</button>
          </div>
        </div>
      </div>
      <div class="search-wrap"><input type="text" id="searchInput" placeholder="搜尋 ASIN 或產品名稱..." oninput="filterList()"></div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
        <button class="filter-btn" onclick="setFilter('up',this)">上漲</button>
        <button class="filter-btn" onclick="setFilter('down',this)">下跌</button>
        <button class="filter-btn" onclick="setFilter('top50',this)">Top 50</button>
        <button class="filter-btn" onclick="setFilter('top100',this)">Top 100</button>
        <button class="filter-btn" onclick="setFilter('nb',this)">🔵 NatureBell</button>
        <button class="filter-btn" onclick="setFilter('new',this)">新品</button>
      </div>
      <div class="asin-list" id="asinList"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>月度走勢</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <div class="seg">
            <button class="active" onclick="setMain('stacked',this)">堆疊</button>
            <button onclick="setMain('line',this)">折線</button>
            <button onclick="setMain('total',this)">總計</button>
          </div>
          <div class="seg">
            <button class="active" onclick="setTopN(5,this)">Top5</button>
            <button onclick="setTopN(10,this)">Top10</button>
            <button onclick="setTopN(30,this)">Top30</button>
          </div>
          <button class="filter-btn" onclick="clearSel()" style="font-size:10px">清除</button>
        </div>
      </div>
      <div style="padding:8px 16px 4px;border-bottom:1px solid #f1f3f5">
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#6b7280;margin-bottom:4px">
          <span>區間：<b id="chartFromLbl" style="color:#3b5bdb"></b> ～ <b id="chartToLbl" style="color:#3b5bdb"></b></span>
          <button class="filter-btn" onclick="resetChartRange()" style="font-size:10px">重置全期間</button>
        </div>
        <div style="position:relative;height:28px">
          <input type="range" id="chartFromSlider" min="0" style="position:absolute;width:100%;top:2px" oninput="onChartRangeInput('from')">
          <input type="range" id="chartToSlider" min="0" style="position:absolute;width:100%;top:16px" oninput="onChartRangeInput('to')">
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div style="padding:14px 16px"><div style="height:300px"><canvas id="mainChart"></canvas></div></div>
    </div>
  </div>
  <div class="row3">
    <div class="card">
      <div class="card-head">
        <h2>熱力表 <span style="font-size:10px;color:#9ca3af">(點 ASIN 看走勢)</span></h2>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="seg">
            <button class="active" onclick="setHmTop(20,this)">Top20</button>
            <button onclick="setHmTop(50,this)">Top50</button>
            <button onclick="setHmTop(100,this)">Top100</button>
          </div>
          <button class="filter-btn" onclick="downloadExcel()" style="font-size:10px;background:#3b5bdb;border-color:#3b5bdb;color:#fff">⬇ 下載 Excel</button>
        </div>
      </div>
      <div class="hm-wrap" id="hmWrap"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2 id="rankTitle">漲幅排行</h2>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <div class="seg">
            <button class="active" onclick="setRankBasis('period',this)">全期間</button>
            <button onclick="setRankBasis('mom',this)">月對月 MoM</button>
            <button onclick="setRankBasis('custom',this)" id="rankBasisCustomBtn">自訂區間</button>
          </div>
          <div class="seg">
            <button class="active" onclick="setRank('up',this)">漲幅</button>
            <button onclick="setRank('down',this)">跌幅</button>
            <button onclick="setRank('abs',this)">絕對值</button>
          </div>
        </div>
      </div>
      <div id="rankRangeRow" style="padding:10px 16px 4px;border-bottom:1px solid #f1f3f5">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#6b7280;margin-bottom:4px">
          <span>起始：<b id="rankFromLbl" style="color:#3b5bdb"></b>　結束：<b id="rankToLbl" style="color:#3b5bdb"></b></span>
          <button class="filter-btn" onclick="downloadRankExcel()" style="font-size:10px;background:#3b5bdb;border-color:#3b5bdb;color:#fff">⬇ 下載 Excel</button>
        </div>
        <div style="position:relative;height:28px">
          <input type="range" id="rankFromSlider" min="0" style="position:absolute;width:100%;top:2px" oninput="onRankRangeInput('from')">
          <input type="range" id="rankToSlider" min="0" style="position:absolute;width:100%;top:16px" oninput="onRankRangeInput('to')">
        </div>
      </div>
      <div style="overflow-y:auto;max-height:380px"><table class="rank-tbl" id="rankTbl"></table></div>
    </div>
  </div>
</div>
</div>

<!-- ===== NB TAB ===== -->
<div id="tab-nb" class="tab-pane">
<div class="page">
  <div class="metrics" id="nb-metrics"></div>
  <div class="row2">
    <div class="card">
      <div class="card-head">
        <h2>NatureBell ASIN</h2>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:10px;color:#9ca3af" id="nb-listCount"></span>
          <div class="seg">
            <button class="active" onclick="nbSortList('latest',this)">最新</button>
            <button onclick="nbSortList('up',this)">漲</button>
            <button onclick="nbSortList('down',this)">跌</button>
          </div>
        </div>
      </div>
      <div class="search-wrap"><input type="text" id="nbSearch" placeholder="搜尋 ASIN 或產品名稱..." oninput="nbFilterList()"></div>
      <div class="asin-list" id="nbAsinList"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>NatureBell 訂閱走勢</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <div class="seg">
            <button class="active" onclick="setNbMain('stacked',this)">堆疊</button>
            <button onclick="setNbMain('line',this)">折線</button>
            <button onclick="setNbMain('total',this)">總計</button>
          </div>
          <div class="seg">
            <button class="active" onclick="setNbTopN(5,this)">Top5</button>
            <button onclick="setNbTopN(10,this)">Top10</button>
            <button onclick="setNbTopN(20,this)">Top20</button>
          </div>
          <button class="filter-btn" onclick="clearNbSel()" style="font-size:10px">清除</button>
        </div>
      </div>
      <div style="padding:8px 16px 4px;border-bottom:1px solid #f1f3f5">
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#6b7280;margin-bottom:4px">
          <span>區間：<b id="nbChartFromLbl" style="color:#3b5bdb"></b> ～ <b id="nbChartToLbl" style="color:#3b5bdb"></b></span>
          <button class="filter-btn" onclick="resetNbChartRange()" style="font-size:10px">重置全期間</button>
        </div>
        <div style="position:relative;height:28px">
          <input type="range" id="nbChartFromSlider" min="0" style="position:absolute;width:100%;top:2px" oninput="onNbChartRangeInput('from')">
          <input type="range" id="nbChartToSlider" min="0" style="position:absolute;width:100%;top:16px" oninput="onNbChartRangeInput('to')">
        </div>
      </div>
      <div class="legend" id="nb-legend"></div>
      <div style="padding:14px 16px"><div style="height:300px"><canvas id="nbMainChart"></canvas></div></div>
    </div>
  </div>
  <div class="row3">
    <div class="card">
      <div class="card-head">
        <h2>熱力表 <span style="font-size:10px;color:#9ca3af">(點 ASIN 看走勢)</span></h2>
        <div class="seg">
          <button class="active" onclick="setNbHmTop(20,this)">Top20</button>
          <button onclick="setNbHmTop(40,this)">Top40</button>
          <button onclick="setNbHmTop(63,this)">全部</button>
        </div>
      </div>
      <div class="hm-wrap" id="nbHmWrap"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <h2 id="nb-rankTitle">漲幅排行</h2>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <div class="seg">
            <button class="active" onclick="setNbRankBasis('period',this)">全期間</button>
            <button onclick="setNbRankBasis('mom',this)">月對月 MoM</button>
            <button onclick="setNbRankBasis('custom',this)" id="nbRankBasisCustomBtn">自訂區間</button>
          </div>
          <div class="seg">
            <button class="active" onclick="setNbRank('up',this)">漲幅</button>
            <button onclick="setNbRank('down',this)">跌幅</button>
            <button onclick="setNbRank('abs',this)">絕對值</button>
          </div>
        </div>
      </div>
      <div id="nbRankRangeRow" style="padding:10px 16px 4px;border-bottom:1px solid #f1f3f5">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#6b7280;margin-bottom:4px">
          <span>起始：<b id="nbRankFromLbl" style="color:#3b5bdb"></b>　結束：<b id="nbRankToLbl" style="color:#3b5bdb"></b></span>
          <button class="filter-btn" onclick="downloadNbRankExcel()" style="font-size:10px;background:#3b5bdb;border-color:#3b5bdb;color:#fff">⬇ 下載 Excel</button>
        </div>
        <div style="position:relative;height:28px">
          <input type="range" id="nbRankFromSlider" min="0" style="position:absolute;width:100%;top:2px" oninput="onNbRankRangeInput('from')">
          <input type="range" id="nbRankToSlider" min="0" style="position:absolute;width:100%;top:16px" oninput="onNbRankRangeInput('to')">
        </div>
      </div>
      <div style="overflow-y:auto;max-height:380px"><table class="rank-tbl" id="nbRankTbl"></table></div>
    </div>
  </div>
</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-info"><h3 id="modalName"></h3><p id="modalAsin"></p></div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-body">
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <div class="seg">
          <button class="active" onclick="setModalMode('line',this)">折線</button>
          <button onclick="setModalMode('bar',this)">長條</button>
        </div>
      </div>
      <div style="height:260px"><canvas id="modalChart"></canvas></div>
    </div>
  </div>
</div>

function computeMoM(cd, months) {
  const curM = months[months.length - 1], prevM = months[months.length - 2];
  Object.keys(cd).forEach(a => {
    const d = cd[a], cur = d.monthly[curM] || 0, prev = d.monthly[prevM] || 0;
    d.mom_cur = cur; d.mom_prev = prev; d.mom_diff = cur - prev;
    d.mom_pct = prev > 0 ? +((cur - prev) / prev * 100).toFixed(2) : (cur > 0 ? 100 : 0);
  });
}
computeMoM(CD, MONTHS);
computeMoM(NB_CD, NB_MONTHS);

function clr(asin, arr) { return COLORS[(arr || ALL_ASINS).indexOf(asin) % COLORS.length]; }
function N(v) { return Math.round(v || 0).toLocaleString(); }
function pStr(p) { return (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; }
function sn(nm, len) { return nm && nm.length > len ? nm.slice(0, len) + '…' : (nm || ''); }

}

function getFiltered() {
  let list = [...ALL_ASINS];
  if (filterMode === 'up') list = list.filter(a => CD[a].pct_change > 0);
  else if (filterMode === 'down') list = list.filter(a => CD[a].pct_change < 0);
  else if (filterMode === 'top50') list = list.slice(0, 50);
  else if (filterMode === 'top100') list = list.slice(0, 100);
  else if (filterMode === 'nb') list = list.filter(a => NB_SET.has(a));
  else if (filterMode === 'new') list = list.filter(a => !CD[a].monthly['2024-11'] && !CD[a].monthly['2024-12'] && CD[a].first_val > 0);
  if (searchQ) list = list.filter(a => a.toLowerCase().includes(searchQ) || (CD[a].name || '').toLowerCase().includes(searchQ));
  if (sortMode === 'up') list.sort((a, b) => CD[b].pct_change - CD[a].pct_change);
  else if (sortMode === 'down') list.sort((a, b) => CD[a].pct_change - CD[b].pct_change);
  return list;
}

  const best = ALL_ASINS.reduce((a, b) => CD[a].pct_change > CD[b].pct_change ? a : b);
  const worst = ALL_ASINS.filter(a => CD[a].pct_change < 0).reduce((a, b) => CD[a].pct_change < CD[b].pct_change ? a : b, ALL_ASINS[0]);
  document.getElementById('metrics').innerHTML =

function chartOpts(stacked) {
  return {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },

    },
    scales: {
      x: { stacked: stacked, ticks: { maxRotation: 45, autoSkip: false, font: { size: 10 } } },
      y: { stacked: stacked, ticks: { callback: v => N(v) } }
    }
  };
}

function buildMainChart() {
  if (mainChart) mainChart.destroy();
  const ctx = document.getElementById('mainChart').getContext('2d');
  const rangeMonths = MONTHS.slice(chartFromIdx, chartToIdx + 1);
  if (mainMode === 'total') {
    mainChart = new Chart(ctx, { type: 'bar', data: { labels: rangeMonths, datasets: [{ label: 'Total', data: rangeMonths.map(m => D.monthly_totals[m] || 0), backgroundColor: '#3b82f666', borderColor: '#3b82f6', borderWidth: 1 }] }, options: chartOpts(false) });

  }
  const active = [...selectedAsins];
  mainChart = new Chart(ctx, {

function buildHeatmap() {
  const list = ALL_ASINS.slice(0, hmTop);
  const maxV = Math.max(...list.flatMap(a => MONTHS.map(m => CD[a].monthly[m] || 0)));
  let h = '<table class="hm"><thead><tr><th class="s">ASIN</th>' +
    MONTHS.map(m => '<th>' + m.slice(5) + '<br><span style="font-size:8px">' + m.slice(0, 4) + '</span></th>').join('') +
    '</tr></thead><tbody>';
  list.forEach(a => {
    h += '<tr><td class="s" onclick="openModal(\'' + a + '\',MONTHS,CD)" title="' + (CD[a].name || '') + '">' + a +
      '<div style="font-size:8px;color:#9ca3af;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + sn(CD[a].name, 10) + '</div></td>';
    MONTHS.forEach(m => {
      const v = CD[a].monthly[m] || 0, t = maxV ? v / maxV : 0;
      const r = Math.round(59 + (191 - 59) * (1 - t)), g = Math.round(130 + (235 - 130) * (1 - t)), b = Math.round(246 + (254 - 246) * (1 - t));
      h += '<td style="background:rgb(' + r + ',' + g + ',' + b + ');color:' + (t > .5 ? '#1e40af' : '#374151') + '">' + (v > 0 ? N(v) : '') + '</td>';
    });
    h += '</tr>';
  });
  document.getElementById('hmWrap').innerHTML = h + '</tbody></table>';
}

  const custPct = a => { const p = custBase(a), c = custCur(a); return p > 0 ? +((c - p) / p * 100).toFixed(2) : (c > 0 ? 100 : 0); };

  const pctOf = a => isMom ? CD[a].mom_pct : isCustom ? custPct(a) : CD[a].pct_change;
  const diffOf = a => isMom ? CD[a].mom_diff : isCustom ? custDiff(a) : (CD[a].last_val - CD[a].first_val);
  const baseOf = a => isMom ? CD[a].mom_prev : isCustom ? custBase(a) : CD[a].first_val;
  const curOf = a => isMom ? CD[a].mom_cur : isCustom ? custCur(a) : CD[a].last_val;
  let list = [...ALL_ASINS].filter(a => baseOf(a) > 0);
  if (rankMode === 'up') list.sort((a, b) => pctOf(b) - pctOf(a));
  else if (rankMode === 'down') list.sort((a, b) => pctOf(a) - pctOf(b));
  else list.sort((a, b) => diffOf(b) - diffOf(a));
  const top = isCustom ? list : list.slice(0, 20);
  const maxA = Math.max(...top.map(a => Math.abs(pctOf(a))), 1);
  const colLabel1 = isMom ? PREV_MONTH : isCustom ? fromM : '首月', colLabel2 = isMom ? LATEST : isCustom ? toM : '末月';

    top.map((a, i) => {

        '<div style="font-size:9.5px;color:#9ca3af;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + sn(d.name, 28) + '</div>' +
        '<div class="bar-bg"><div class="bar-f" style="width:' + bw + '%;background:' + (up ? '#10b981' : '#ef4444') + '"></div></div></td>' +
        '<td style="text-align:right;font-size:10.5px;color:#6b7280">' + N(baseOf(a)) + '</td>' +
        '<td style="text-align:right;font-size:10.5px;color:#6b7280">' + N(curOf(a)) + '</td>' +
        '<td style="text-align:right;font-size:12px;font-weight:600;color:' + (up ? '#15803d' : '#dc2626') + '">' + pStr(p) + '</td></tr>';
    }).join('') + '</tbody>';
  rankExport = { colLabel1, colLabel2, rows: top.map(a => ({ asin: a, name: CD[a].name, base: baseOf(a), cur: curOf(a), diff: diffOf(a), pct: pctOf(a) })) };
}

function buildNbMetrics() {

  const momUp = parseFloat(mom) >= 0;
  const best = NB_ASINS.reduce((a, b) => NB_CD[a].pct_change > NB_CD[b].pct_change ? a : b);
  const worst = NB_ASINS.reduce((a, b) => NB_CD[a].pct_change < NB_CD[b].pct_change ? a : b);

  modalChart = new Chart(ctx, {
    type: modalMode === 'bar' ? 'bar' : 'line',
    data: { labels: modalCtxMonths, datasets: [{ label: asin, data: modalCtxMonths.map(m => d.monthly[m] || 0), borderColor: c, backgroundColor: modalMode === 'bar' ? c + '88' : c + '20', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', bodyColor: '#94a3b8', callbacks: { label: c => asin + ': ' + N(c.parsed.y) } } }, scales: { x: { ticks: { maxRotation: 45, autoSkip: false, font: { size: 10 } } }, y: { ticks: { callback: v => N(v) } } } }
  });
}

function closeModal(e) { if (e.target === document.getElementById('modalOverlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modalOverlay').classList.remove('open'); if (modalChart) { modalChart.destroy(); modalChart = null; } }
function setModalMode(m, btn) { modalMode = m; btn.closest('.seg').querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); buildModalChart(document.getElementById('modalAsin').textContent); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });
